version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - godot
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usetesting
  settings:
    godot:
      scope: declarations
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: context-as-argument
        - name: unused-parameter
    misspell:
      locale: US
      # The API returns both "Canceled" and "Cancelled".
      ignore-rules:
        - cancelled
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/axiansinfoma/go-bcadmin
