name: Feature request
description: Suggest a new endpoint, option or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the use case. Link the Admin Center API documentation of the endpoint if it is about one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you would like to call it from Go (optional).
      render: go
